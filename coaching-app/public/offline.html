<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0d12">
<title>You're offline · Vital Fusion</title>
<style>
  html, body { margin: 0; height: 100%; background: #0b0d12; color: #f4f5f7;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
  main { min-height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center;
    text-align: center; padding: 32px 24px; box-sizing: border-box; }
  img { width: 72px; height: 72px; border-radius: 18px; margin-bottom: 20px; }
  h1 { font-size: 26px; margin: 0 0 10px; }
  p { color: #a9aeb8; font-size: 17px; line-height: 1.5; margin: 0 0 24px; max-width: 320px; }
  button { background: #6a9fc6; color: #fff; border: 0; border-radius: 14px; font-size: 18px; font-weight: 700;
    padding: 16px 28px; min-height: 54px; }
</style>
</head>
<body>
<main>
  <img src="/icons/icon-192.png" alt="">
  <h1>You're offline</h1>
  <p>Your coaching app needs an internet connection. Check your signal or Wi-Fi and try again.</p>
  <button onclick="location.reload()">Try again</button>
</main>
</body>
</html>
